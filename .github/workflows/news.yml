name: Actualizare stiri
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-bot
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarca calendarul Forex Factory
        run: |
          curl -fsSL -A "Mozilla/5.0" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o news.tmp && python3 -c "import json; d=json.load(open('news.tmp')); assert isinstance(d, list) and len(d) > 0" && mv news.tmp news.json || echo "stiri - nu s-au putut descarca acum"
      - name: Analiza XAUUSD
        run: |
          python3 analyze.py || echo "analiza - esec temporar"
      - name: Salveaza in site
        run: |
          git config user.name "byzyp-bot"
          git config user.email "byzyp-bot@users.noreply.github.com"
          git add news.json 2>/dev/null || true
          git add xauusd.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizare stiri si analiza" && git pull --rebase && git push)
