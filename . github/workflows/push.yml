name: Notificari
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Trimite o notificare de test'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: push-bot
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trimite notificarile
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
          TEST_PUSH: ${{ github.event.inputs.test }}
        run: |
          npm install --no-save --silent web-push@3.6.7
          cp push-bot.js push-bot.mjs
          node push-bot.mjs
      - name: Salveaza starea
        run: |
          git config user.name "byzyp-bot"
          git config user.email "byzyp-bot@users.noreply.github.com"
          git add sent.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Notificari trimise" && git pull --rebase && git push)
